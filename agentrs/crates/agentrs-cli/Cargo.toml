[package]
name = "agentrs-cli"
description = "CLI binary for agentrs — a multi-provider AI agent with tool orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["ai", "agent", "cli", "llm", "anthropic"]
categories = ["command-line-utilities"]

[[bin]]
name = "agentrs"
path = "src/main.rs"

[dependencies]
agentrs-agent.workspace    = true
agentrs-compact.workspace  = true
agentrs-config.workspace   = true
agentrs-memory.workspace   = true
agentrs-providers.workspace = true
agentrs-tools.workspace    = true
agentrs-mcp.workspace      = true
agentrs-protocol.workspace = true
agentrs-skills.workspace   = true
agentrs-types.workspace    = true
agentrs-tui.workspace      = true

tokio.workspace              = true
anyhow.workspace             = true
clap.workspace               = true
tracing.workspace            = true
tracing-subscriber.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
tempfile.workspace = true
