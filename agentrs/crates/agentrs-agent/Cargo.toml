[package]
name = "agentrs-agent"
description = "Agent engine, session management, output sinks, and orchestration for agentrs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agentrs-types.workspace     = true
agentrs-protocol.workspace  = true
agentrs-config.workspace    = true
agentrs-providers.workspace = true
agentrs-tools.workspace     = true
agentrs-mcp.workspace       = true
agentrs-skills.workspace    = true
agentrs-memory.workspace    = true
agentrs-compact.workspace   = true

tracing.workspace     = true
tokio-util.workspace   = true
tokio.workspace       = true
futures.workspace     = true
serde.workspace       = true
serde_json.workspace  = true
async-trait.workspace = true
anyhow.workspace      = true
thiserror.workspace   = true
glob.workspace        = true
url.workspace         = true
chrono.workspace      = true
uuid.workspace        = true
dirs.workspace        = true
crossterm.workspace   = true
is-terminal.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
agentrs-mcp = { path = "../agentrs-mcp", features = ["test-utils"] }
wiremock.workspace    = true
tokio-test.workspace  = true
tempfile.workspace    = true
mockall.workspace     = true
rstest.workspace      = true
serial_test.workspace = true
base64.workspace    = true

# ── Integration test binaries ──────────────────────────────────────────────
[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
# E2E tests require real API keys; run via: cargo nextest run --profile e2e --test e2e

[[test]]
name = "acceptance"
path = "tests/acceptance/mod.rs"
# Acceptance tests for evolution features; run via: cargo nextest run --profile e2e --test acceptance
