[package]
name = "agentrs-dev-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Non-production terminal harness for exercising AgentRS end to end"
publish = false

[[bin]]
name = "agentrs-tui"
path = "src/main.rs"

[dependencies]
agentrs-contracts = { workspace = true }
agentrs-types = { workspace = true }
agentrs-runtime = { path = "../agentrs-runtime" }
agentrs-provider = { path = "../agentrs-provider" }
agentrs-dev-adapter = { path = "../agentrs-dev-adapter" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ratatui = "0.29"
crossterm = "0.28"
uuid = { workspace = true }

[lints]
workspace = true

