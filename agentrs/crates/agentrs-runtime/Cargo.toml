[package]
name = "agentrs-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AgentRS: RuntimeHost、AgentEngine、Surface 投影、生命周期与恢复"

[dependencies]
agentrs-contracts = { workspace = true }
agentrs-prompts = { path = "../agentrs-prompts" }
agentrs-types = { workspace = true }
# 缓存分段与归因。context 只依赖 contracts/types，不会形成环。
agentrs-context = { path = "../agentrs-context" }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync", "macros"] }
futures = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
agentrs-testkit = { path = "../agentrs-testkit" }
async-trait = { workspace = true }

[lints]
workspace = true
